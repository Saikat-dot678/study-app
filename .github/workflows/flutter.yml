name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - name: Narrow Home regression
        run: flutter test test/narrow_layout_probe_test.dart --plain-name "narrow home layout is stable"
      - name: Narrow Library regression
        run: flutter test test/narrow_layout_probe_test.dart --plain-name "narrow library layout is stable"
      - name: Responsive 360x640
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 360.0x640.0"
      - name: Responsive 412x915
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 412.0x915.0"
      - name: Responsive 800x1000
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 800.0x1000.0"
      - name: Responsive 1366x768
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 1366.0x768.0"
      - name: Responsive 1920x1080
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 1920.0x1080.0"
      - name: Shell and reader regression tests
        run: flutter test test/frontend_regression_test.dart
      - name: Full Flutter test suite
        run: flutter test
      - run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: powershell -ExecutionPolicy Bypass -File .\tool\patch_windows_cmake.ps1
      - run: flutter pub get
      - run: flutter analyze
      - name: Narrow Home regression
        run: flutter test test/narrow_layout_probe_test.dart --plain-name "narrow home layout is stable"
      - name: Narrow Library regression
        run: flutter test test/narrow_layout_probe_test.dart --plain-name "narrow library layout is stable"
      - name: Responsive 360x640
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 360.0x640.0"
      - name: Responsive 412x915
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 412.0x915.0"
      - name: Responsive 800x1000
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 800.0x1000.0"
      - name: Responsive 1366x768
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 1366.0x768.0"
      - name: Responsive 1920x1080
        run: flutter test test/responsive_layout_test.dart --plain-name "home and library avoid layout errors at 1920.0x1080.0"
      - name: Shell and reader regression tests
        run: flutter test test/frontend_regression_test.dart
      - name: Full Flutter test suite
        run: flutter test
      - run: flutter build windows --debug
