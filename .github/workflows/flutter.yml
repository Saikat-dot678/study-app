name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - name: Responsive layout regression tests
        run: flutter test test/responsive_layout_test.dart
      - name: Shell and reader regression tests
        run: flutter test test/frontend_regression_test.dart
      - name: Full Flutter test suite
        run: flutter test
      - run: flutter build apk --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: powershell -ExecutionPolicy Bypass -File .\tool\patch_windows_cmake.ps1
      - run: flutter pub get
      - run: flutter analyze
      - name: Responsive layout regression tests
        run: flutter test test/responsive_layout_test.dart
      - name: Shell and reader regression tests
        run: flutter test test/frontend_regression_test.dart
      - name: Full Flutter test suite
        run: flutter test
      - run: flutter build windows --debug
