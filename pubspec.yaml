name: study_app
description: Offline-first student library for notes, books, slides, recordings, videos and shared files.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfrx: ^2.6.1
  just_audio: ^0.10.6
  video_player: ^2.14.0
  archive: ^4.2.0
  xml: ^7.0.1
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
