org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental caches cannot relativize plugin sources when the project
# and the global Pub cache live on different Windows drive letters (for
# example E:\study-app vs C:\Users\...\Pub\Cache). Full Kotlin compilation is
# slightly slower but is stable across Windows development setups.
kotlin.incremental=false
